services:
  nginx:
    image: nginx:latest
    container_name: nginx-ws-http
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
    depends_on:
      - websocket-server
    networks:
      - app-network
    restart: unless-stopped

  websocket-server:
    image: node:18
    container_name: websocket-http-server
    working_dir: /app
    # As dependencias sao instaladas no start porque node_modules/ nao e
    # versionado. Sem isto, um clone limpo morre com "Cannot find module 'ws'".
    command: sh -c "npm install --no-package-lock --silent --no-audit --no-fund && node index.js"
    volumes:
      - ./src:/app
      # Volume anonimo: mantem o node_modules dentro do container, sem sujar
      # a pasta do host nem depender do que ja existe la.
      - /app/node_modules
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge
