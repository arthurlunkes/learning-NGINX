##############################################################################
# Exemplo 8 - NGINX de borda + um tier por empresa
#
# Duas redes de proposito: a borda NAO alcanca as aplicacoes, so os tiers.
# Isso e o que torna a segmentacao demonstravel:
#   docker compose exec borda getent hosts nimbus-app   -> nao resolve
##############################################################################

services:

  # ==========================================================================
  # BORDA - unico container exposto ao host
  # ==========================================================================
  borda:
    image: nginx:latest
    container_name: borda
    hostname: borda
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./borda/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./borda/snippets:/etc/nginx/snippets:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - nimbus-lb
      - orion-lb
      - vertex-lb
      - impressao-lb
    networks:
      dmz:
        # IP fixo porque os tiers confiam nele nominalmente em
        # `set_real_ip_from`. Confiar na subnet inteira deixaria qualquer
        # container forjar X-Forwarded-For.
        ipv4_address: 172.28.0.10
    restart: unless-stopped

  # ==========================================================================
  # TIERS DAS EMPRESAS - uma "maquina" por cliente
  # ==========================================================================
  nimbus-lb:
    image: nginx:latest
    container_name: nimbus-lb
    hostname: nimbus-lb
    volumes:
      - ./nimbus/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tier-comum:/etc/nginx/snippets:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - nimbus-app
    networks: [dmz, interna]
    restart: unless-stopped

  orion-lb:
    image: nginx:latest
    container_name: orion-lb
    hostname: orion-lb
    volumes:
      - ./orion/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tier-comum:/etc/nginx/snippets:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - orion-app
    networks: [dmz, interna]
    restart: unless-stopped

  vertex-lb:
    image: nginx:latest
    container_name: vertex-lb
    hostname: vertex-lb
    volumes:
      - ./vertex/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./tier-comum:/etc/nginx/snippets:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - vertex-app
    networks: [dmz, interna]
    restart: unless-stopped

  # ==========================================================================
  # TIER DE IMPRESSAO - traduz municipio -> porta do DevExpress
  # ==========================================================================
  impressao-lb:
    image: nginx:latest
    container_name: impressao-lb
    hostname: impressao-lb
    volumes:
      - ./impressao/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - devexpress
    networks: [dmz, interna]
    restart: unless-stopped

  # ==========================================================================
  # APLICACOES - so na rede interna, inalcancaveis a partir da borda
  # ==========================================================================
  nimbus-app:
    image: node:18
    container_name: nimbus-app
    hostname: nimbus-app
    working_dir: /app
    environment:
      EMPRESA: Nimbus
    # O `npm install` no start resolve a dependencia `ws` sem exigir build.
    command: sh -c "npm install --no-package-lock --silent --no-audit --no-fund && node index.js"
    volumes:
      - ./app:/app
      # Volume anonimo: da a cada container o SEU node_modules. Sem isto os
      # tres apps instalariam em cima do mesmo ./app/node_modules do host,
      # ao mesmo tempo, e corromperiam a instalacao um do outro.
      - /app/node_modules
    networks: [interna]
    restart: unless-stopped

  orion-app:
    image: node:18
    container_name: orion-app
    hostname: orion-app
    working_dir: /app
    environment:
      EMPRESA: Orion
    command: sh -c "npm install --no-package-lock --silent --no-audit --no-fund && node index.js"
    volumes:
      - ./app:/app
      - /app/node_modules
    networks: [interna]
    restart: unless-stopped

  vertex-app:
    image: node:18
    container_name: vertex-app
    hostname: vertex-app
    working_dir: /app
    environment:
      EMPRESA: Vertex
    command: sh -c "npm install --no-package-lock --silent --no-audit --no-fund && node index.js"
    volumes:
      - ./app:/app
      - /app/node_modules
    networks: [interna]
    restart: unless-stopped

  # Uma aplicacao por porta, uma porta por municipio. Sem dependencias, entao
  # roda direto - nao precisa de npm install.
  devexpress:
    image: node:18
    container_name: devexpress
    hostname: devexpress
    working_dir: /app
    command: node index.js
    volumes:
      - ./devexpress:/app
    networks: [interna]
    restart: unless-stopped

networks:
  # Borda <-> tiers
  dmz:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
  # Tiers <-> aplicacoes
  interna:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
