services:
  nginx:
    container_name: nginx
    hostname: nginx
    image: nginx:latest
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
    depends_on:
      - node1
      - node2
      - node3
    networks:
      - app-network

  node1:
    container_name: node1
    hostname: node1
    image: node:18
    # node_modules/ nao e versionado, entao instala no start. Sem isto, um
    # clone limpo morre com "Cannot find module 'express'".
    command: sh -c "npm install --no-package-lock --silent --no-audit --no-fund && node index.js"
    volumes:
      - ./app:/app
      # Volume anonimo: cada container ganha o SEU node_modules. Sem ele, as
      # tres instancias instalariam em cima da mesma pasta do host ao mesmo
      # tempo e corromperiam a instalacao uma da outra.
      - /app/node_modules
    working_dir: /app
    networks:
      - app-network

  node2:
    container_name: node2
    hostname: node2
    image: node:18
    # node_modules/ nao e versionado, entao instala no start. Sem isto, um
    # clone limpo morre com "Cannot find module 'express'".
    command: sh -c "npm install --no-package-lock --silent --no-audit --no-fund && node index.js"
    volumes:
      - ./app:/app
      # Volume anonimo: cada container ganha o SEU node_modules. Sem ele, as
      # tres instancias instalariam em cima da mesma pasta do host ao mesmo
      # tempo e corromperiam a instalacao uma da outra.
      - /app/node_modules
    working_dir: /app
    networks:
      - app-network

  node3:
    container_name: node3
    hostname: node3
    image: node:18
    # node_modules/ nao e versionado, entao instala no start. Sem isto, um
    # clone limpo morre com "Cannot find module 'express'".
    command: sh -c "npm install --no-package-lock --silent --no-audit --no-fund && node index.js"
    volumes:
      - ./app:/app
      # Volume anonimo: cada container ganha o SEU node_modules. Sem ele, as
      # tres instancias instalariam em cima da mesma pasta do host ao mesmo
      # tempo e corromperiam a instalacao uma da outra.
      - /app/node_modules
    working_dir: /app
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
