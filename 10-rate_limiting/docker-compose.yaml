##############################################################################
# Exemplo 10 - Rate limiting e protecao
##############################################################################

services:
  nginx:
    image: nginx:latest
    container_name: nginx-ratelimit
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./snippets:/etc/nginx/snippets:ro
    depends_on:
      - app
    networks: [rate-network]
    restart: unless-stopped

  app:
    image: node:18
    container_name: ratelimit-app
    hostname: app
    working_dir: /app
    command: node index.js
    volumes:
      - ./app:/app
    networks: [rate-network]
    restart: unless-stopped

networks:
  rate-network:
    driver: bridge
    ipam:
      config:
        # Subnet fixa para o bloco `geo` do nginx.conf poder se referir a ela.
        - subnet: 172.30.0.0/16
