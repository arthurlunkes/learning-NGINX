##############################################################################
# Exemplo 16 - Observabilidade avancada
#
# nginx -> exporter -> prometheus -> grafana
##############################################################################

services:
  nginx:
    image: nginx:latest
    container_name: nginx-observabilidade
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./logs:/var/log/nginx
    depends_on: [app1, app2]
    networks: [obs-network]
    restart: unless-stopped

  app1: &app
    image: node:18
    container_name: obs-app1
    hostname: app1
    working_dir: /app
    command: node index.js
    volumes:
      - ./app:/app
    networks: [obs-network]
    restart: unless-stopped

  app2:
    <<: *app
    container_name: obs-app2
    hostname: app2

  # Traduz o texto do stub_status em metricas no formato do Prometheus.
  exporter:
    image: nginx/nginx-prometheus-exporter:latest
    container_name: nginx-exporter
    hostname: exporter
    command:
      - --nginx.scrape-uri=http://nginx:80/nginx-status
    ports:
      - "9113:9113"
    depends_on: [nginx]
    networks: [obs-network]
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    hostname: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    networks: [obs-network]
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: grafana
    ports:
      - "3001:3000"
    environment:
      # Sem login, para o exemplo abrir direto. NUNCA faca isso em producao.
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    volumes:
      - ./grafana/datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
    depends_on: [prometheus]
    networks: [obs-network]
    restart: unless-stopped

networks:
  obs-network:
    driver: bridge
    ipam:
      config:
        # Subnet fixa: o allow/deny do /nginx-status se refere a ela.
        - subnet: 172.32.0.0/16
