##############################################################################
# Exemplo 3 - Timeouts
#
# O backend demora de proposito, para os timeouts terem o que estourar.
##############################################################################

services:
  nginx:
    image: nginx:latest
    container_name: nginx-timeouts
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./snippets:/etc/nginx/snippets:ro
    depends_on: [app]
    networks: [timeout-network]
    restart: unless-stopped

  app:
    image: node:18
    container_name: timeouts-app
    hostname: app
    working_dir: /app
    command: node index.js
    volumes:
      - ./app:/app
    networks: [timeout-network]
    restart: unless-stopped

networks:
  timeout-network:
    driver: bridge
